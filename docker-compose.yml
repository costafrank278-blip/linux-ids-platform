version: '3.8'

services:
  ids-platform:
    build: .
    container_name: linux-ids-platform
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - HOST=0.0.0.0
      - PORT=5000
      - DATABASE_PATH=/app/backend/ids_platform.db
      - AUTH_LOG_FILE=/var/log/auth.log
    volumes:
      - ./backend:/app/backend
      - /var/log/auth.log:/var/log/auth.log:ro
    restart: unless-stopped
